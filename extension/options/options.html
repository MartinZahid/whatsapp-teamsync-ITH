<!doctype html>
<html lang="es">

    <title>Opciones · WhatsApp Team Sync</title>
    <link rel="stylesheet" href="./options.css" />
  </head>
  <body>

      <div class="logo">TS</div>

        <h1>WhatsApp Team Sync</h1>
