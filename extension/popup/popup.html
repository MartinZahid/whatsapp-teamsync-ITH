<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WhatsApp Team Sync</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <header class="head">
      <div class="logo">TS</div>
      <div>
        <h1>WhatsApp Team Sync</h1>
        <p class="sub">Presencia del equipo</p>
      </div>
    </header>

    <main>
      <section class="card">
        <label class="label" for="agent">Agente</label>
        <select id="agent" class="input"></select>

        <label class="label" for="server-url">URL del servidor</label>
        <div class="row">
          <input id="server-url" class="input" type="text" placeholder="ws://localhost:3001" />
          <button id="test" class="btn-ghost" type="button">Probar</button>
        </div>
        <p id="test-result" class="hint"></p>
      </section>

      <section class="card">
        <div class="status-row">
          <span id="dot" class="dot"></span>
          <span id="status-text">Desconectado</span>
        </div>
        <p id="status-detail" class="hint"></p>
        <div class="actions">
          <button id="pause" class="btn btn-pause" type="button">Pausar</button>
          <button id="help" class="btn btn-help" type="button">Pedir ayuda</button>
        </div>
      </section>

      <section class="card">
        <h2>Equipo</h2>
        <ul id="agents" class="agents"></ul>
      </section>
    </main>

    <div id="alert" class="alert hidden"></div>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
