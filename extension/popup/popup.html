<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WhatsApp Team Sync</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <header class="head">
      <img id="logo" class="logo" alt="WhatsApp Team Sync" />
      <h2>WhatsApp Team Sync</h2>
    </header>

    <main>
      <div id="current" class="current-agent-bar hidden">
        <span id="current-dot" class="status-dot disconnected"></span>
        <span id="current-name" class="current-name">Sin agente</span>
        <span id="current-badge" class="badge offline">Desconectado</span>
      </div>

      <section class="setup-card">
        <div class="card-heading">
          <span class="card-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="2" y="3" width="20" height="7" />
              <rect x="2" y="14" width="20" height="7" />
              <path d="M6 6.5h.01M6 17.5h.01" />
            </svg>
          </span>
          <div>
            <h3>Servidor</h3>
            <p>Dirección del servicio de presencia.</p>
          </div>
        </div>

        <label for="server-url">URL del servidor WebSocket</label>
        <input id="server-url" class="input" type="text" placeholder="ws://localhost:3001" />
        <button id="test" class="btn btn-primary" type="button">Probar conexión</button>
        <p id="test-result" class="connection-result"></p>
      </section>

      <section class="setup-card">
        <div class="card-heading">
          <span class="card-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="8" r="4" />
              <path d="M4 21a8 8 0 0 1 16 0" />
            </svg>
          </span>
          <div>
            <h3>Agente</h3>
            <p>Selecciona tu nombre para conectarte.</p>
          </div>
        </div>

        <ul id="agent-list" class="agent-list"></ul>
      </section>

      <div class="action-buttons">
        <button id="pause" class="btn btn-secondary" type="button">Pausar</button>
        <button id="help" class="btn btn-help" type="button">Pedir ayuda</button>
      </div>

      <div id="connection" class="server-status">✓ Conectado al servidor</div>
    </main>

    <div id="alert" class="alert hidden"></div>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
