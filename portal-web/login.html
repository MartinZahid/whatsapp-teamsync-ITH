<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión · WhatsApp Team Sync</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="pagina-login">
  <div class="franja"></div>

  <main class="contenedor-login">
    <!-- Mientras no exista el login real, el botón solo lleva a En vivo.
         Los campos no llevan `name` para que la contraseña no viaje en la URL;
         se agregan cuando js/login.js mande los datos al servidor. -->
    <form class="tarjeta-login" id="form-login" action="en-vivo.html" method="get">
      <header class="encabezado-login">
        <div class="logo" aria-hidden="true"></div>
        <h1>WhatsApp Team Sync</h1>
        <p>Portal web de monitoreo</p>
      </header>

      <div class="campo">
        <label for="usuario">Usuario</label>
        <input id="usuario" type="text" autocomplete="username">
      </div>

      <div class="campo">
        <label for="contrasena">Contraseña</label>
        <input id="contrasena" type="password" autocomplete="current-password">
      </div>

      <p class="mensaje-error" id="error-login" hidden>Usuario o contraseña incorrectos.</p>

      <button class="boton boton-grande" type="submit">Iniciar sesión</button>
    </form>
  </main>
</body>
</html>
